name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binary:
    name: Build Linux Binary
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: |
          cargo build --release

      - name: Prepare artifact
        run: |
          cp target/release/herakles-node-exporter herakles-node-exporter-linux-amd64
          chmod +x herakles-node-exporter-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: herakles-node-exporter-linux-amd64
          path: herakles-node-exporter-linux-amd64
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: build-binary
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: herakles-node-exporter-linux-amd64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: herakles-node-exporter-linux-amd64
